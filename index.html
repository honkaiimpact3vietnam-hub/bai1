<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        let year=parseInt(prompt("Nhập vào năm cần kiểm tra: "));
        let isYear= false;
        if (year%400==0 || (year%4==0 && year%100!=0)){
            isYear=true;
        }
        if(isYear) alert(year +": là năm nhuận");
        else alert(year +": không là năm nhuận");
    </script>
</body>
</html>
